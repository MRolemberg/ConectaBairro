<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b5e20">
  <meta name="description" content="ConectaBairro - Conectando prestadores locais e moradores na comunidade AMBE.">
  <title>ConectaBairro PWA</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header role="banner">
    <h1>ConectaBairro</h1>
    <p>Serviços Comunitários & Economia Circular — AMBE</p>
  </header>

  <main class="container" role="main">

    <!-- TELA 1: VITRINE DE SERVIÇOS E FILTROS (RF01) -->
    <section id="secao-vitrine" aria-label="Vitrine de Prestadores Comunitários">
      <div class="actions-bar">
        <h2>Profissionais da Região</h2>
        <button class="btn btn-primary" onclick="mostrarTela('cadastro')" aria-label="Cadastrar-se como prestador autônomo">
          + Quero Trabalhar
        </button>
      </div>

      <!-- Filtro horizontal de categorias -->
      <nav id="categories-nav" class="categories-nav" aria-label="Filtro de categorias de serviços">
        <!-- Renderizado dinamicamente via app.js -->
      </nav>

      <!-- Lista de prestadores -->
      <section id="prestadores-list" class="cards-list" aria-live="polite">
        <!-- Renderizado dinamicamente via app.js -->
      </section>
    </section>

    <!-- TELA 2: AUTO-CADASTRO DE PRESTADOR (RF03, RNF01, RNF02) -->
    <section id="secao-cadastro" style="display: none;" aria-label="Formulário de Auto-Cadastro de Prestador">
      <div class="actions-bar">
        <h2>Cadastro de Prestador</h2>
        <button class="btn btn-secondary" style="width: auto;" onclick="mostrarTela('vitrine')" aria-label="Voltar para a vitrine">
          ← Voltar
        </button>
      </div>

      <form id="form-cadastro-prestador" class="card" novalidate>
        <div class="form-group">
          <label for="form-nome">Nome Completo:</label>
          <input type="text" id="form-nome" name="nome" placeholder="Ex: Carlos Eduardo de Oliveira" required minlength="3" maxlength="100">
        </div>

        <div class="form-group">
          <label for="form-telefone">Telefone WhatsApp:</label>
          <input type="tel" id="form-telefone" name="telefone" placeholder="(11) 98765-4321" required>
        </div>

        <div class="form-group">
          <label for="form-categoria">Categoria do Serviço:</label>
          <select id="form-categoria" name="categoria_id" required>
            <!-- Opções inseridas dinamicamente -->
          </select>
        </div>

        <div class="form-group">
          <label for="form-descricao">Descrição do seu Serviço:</label>
          <textarea id="form-descricao" name="descricao" rows="3" placeholder="Conte brevemente sobre sua experiência e os serviços que realiza..." required minlength="10" maxlength="500"></textarea>
        </div>

        <div id="cadastro-feedback" role="alert" style="margin-bottom: 12px; font-weight: 600;"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" aria-label="Confirmar e publicar cadastro na vitrine">
          Confirmar e Publicar Anúncio
        </button>
      </form>
    </section>

    <!-- TELA 3: CONFIRMAÇÃO E CONTATO VIA WHATSAPP (RF02, RA01) -->
    <section id="secao-conexao" style="display: none;" aria-label="Confirmação de Conexão com o Prestador">
      <!-- Banner com Redundância Informativa Rigorosa (Texto explícito, símbolo e alto contraste) -->
      <div class="success-banner" role="status">
        <span class="success-icon-symbol" aria-hidden="true">✔</span>
        <h2>CONEXÃO REALIZADA!</h2>
        <p>Seus dados foram vinculados com sucesso ao profissional selecionado.</p>
      </div>

      <div class="card">
        <div id="conexao-detalhes" style="margin-bottom: 20px;">
          <!-- Detalhes preenchidos dinamicamente -->
        </div>

        <a id="btn-whatsapp-action" class="btn btn-whatsapp" href="#" role="button" aria-label="Abrir conversa no WhatsApp com o prestador">
          Abrir Conversa no WhatsApp
        </a>

        <button id="btn-copiar-telefone" class="btn btn-secondary" onclick="copiarTelefonePrestador()" aria-label="Copiar número de telefone para a área de transferência">
          📋 Copiar Número de Telefone
        </button>
        <p id="copiar-feedback" role="status" aria-live="polite" style="font-size: 0.9rem; text-align: center; margin-top: 6px; font-weight: 600; min-height: 20px;"></p>

        <button class="btn btn-secondary" onclick="mostrarTela('vitrine')" aria-label="Voltar para a vitrine comunitária">
          Voltar à Vitrine
        </button>
      </div>
    </section>

  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
